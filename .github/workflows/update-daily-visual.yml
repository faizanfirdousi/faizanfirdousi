name: Update Daily Visual

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-daily-visual
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-visual:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update daily visual from Unsplash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: bash scripts/update-image.sh

      - name: Commit and push README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md .github/unsplash-last-id

          if git diff --staged --quiet; then
            echo "No README changes to commit."
            exit 0
          fi

          git commit -m "Update daily visual from Unsplash"
          git pull --rebase -X theirs origin main
          git push origin main

